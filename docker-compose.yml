services:
  mysql:
    image: mysql:8.0
    container_name: loan_ai_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: loan_ai_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - loan_ai_net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: loan_ai_ml_service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loan_ai_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_ai_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:password123@mysql:3306/loan_ai_db"
      JWT_SECRET: "super-secret-jwt-key-loan-ai-2026-production-change-me"
      ML_SERVICE_URL: "http://ml-service:8000"
      CREDIT_PROVIDER_MODE: "mock"
      CREDIT_PROVIDER_URL: "https://api.creditbureau.example.com"
      CREDIT_PROVIDER_API_KEY: "mock-bureau-api-key-demo"
      CORS_ORIGIN: "http://localhost:3000,http://localhost"
    command: >
      sh -c "npx prisma db push && node dist/seed.js && node dist/index.js"
    networks:
      - loan_ai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan_ai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - loan_ai_net

volumes:
  mysql_data:

networks:
  loan_ai_net:
    driver: bridge
