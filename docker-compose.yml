services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_xai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./loan_xai.db
      - SECRET_KEY=xai-digital-lending-secret-key-rbi-compliant-2026
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loan_xai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan_xai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - loan_xai_net

volumes:
  backend_data:

networks:
  loan_xai_net:
    driver: bridge
